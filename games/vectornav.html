<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>向量迷航｜高中數學視覺實驗室</title>
<meta name="theme-color" content="#0b101c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="../js/data.js"></script>
<script src="../js/common.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, katexOpt)"></script>
</head>
<body>
<main class="page">
  <h1>🚀 向量迷航</h1>
  <p class="subtitle">引擎只能沿指定向量噴射。在燃料耗盡前避開隕石，抵達目標星球！</p>

  <div class="lab">
    <div class="hud">
      <div class="box"><small>關卡</small><b id="h-level">1</b></div>
      <div class="box"><small>剩餘燃料</small><b id="h-fuel">0</b></div>
      <div class="box"><small>得分</small><b id="h-score">0</b></div>
      <div class="box"><small>最高關卡</small><b id="h-best">1</b></div>
    </div>
    <canvas id="c1"></canvas>
    <div class="btn-row" id="moves"></div>
    <div class="btn-row">
      <button class="btn" id="b-undo">↩ 復原一步</button>
      <button class="btn" id="b-reset">⟲ 重來</button>
      <button class="btn" id="b-skip">⏭ 換一題（−10 分）</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="section">
    <h2>玩法</h2>
    <ul class="rules">
      <li>🚀 是你的太空船，🪐 是目標。每按一次按鈕，太空船就沿該向量（或反方向）移動一步、消耗 1 格燃料。</li>
      <li>每一步的<b>落點</b>不能是隕石 ☄️，也不能飛出星圖。淡色箭頭預告每個按鈕會把你帶到哪裡。</li>
      <li>燃料剛好只夠走最短路線（前幾關多送 1 格）—— 你需要找出「目標位移 $= m\vec{u} + n\vec{v}$」的整數解，還要安排避開隕石的<b>順序</b>。</li>
      <li>第 4 關起會有第三個向量，組合更多、也更燒腦。</li>
    </ul>
  </div>
</main>
<footer>高中數學視覺實驗室</footer>

<script>
injectNav(true);

const XR = 9, YR = 6;
const p = new Plot(document.getElementById("c1"), { xmin:-XR-0.7, xmax:XR+0.7, ymin:-YR-0.7, ymax:YR+0.7, heightPx:470, aspect:true });
const $ = id => document.getElementById(id);
const POOL = [[2,1],[-1,2],[1,3],[3,-1],[1,-2],[2,3],[3,1],[2,-1],[1,2],[3,2],[1,1],[2,-3]];
const COLS = ["--curve1", "--curve2", "--curve3"], NAMES = ["u", "v", "w"];
const key = (x, y) => x + "," + y;
const inB = (x, y) => Math.abs(x) <= XR && Math.abs(y) <= YR;
let level = 1, score = 0, S, vecs, start, target, rocks, fuel, fuel0, path;
let best = +(localStorage.getItem("vnav-best") || 1);
const say = (t, cls = "") => { $("msg").innerHTML = t; $("msg").className = "msg " + cls; };
const rnd = n => Math.floor(Math.random() * n);

/** BFS 求避開隕石的最少步數；無解回傳 -1 */
function bfs(from, to, vs, rockSet) {
  const seen = new Map([[key(...from), 0]]), q = [from];
  while (q.length) {
    const [x, y] = q.shift(), d = seen.get(key(x, y));
    if (x === to[0] && y === to[1]) return d;
    for (const [a, b] of vs) for (const s of [1, -1]) {
      const nx = x + s * a, ny = y + s * b, k = key(nx, ny);
      if (!inB(nx, ny) || rockSet.has(k) || seen.has(k)) continue;
      seen.set(k, d + 1); q.push([nx, ny]);
    }
  }
  return -1;
}

function gen() {
  const nv = level >= 4 ? 3 : 2;
  const want = Math.min(3 + Math.floor(level / 2), 8);          // 目標最少步數
  for (let t = 0; t < 3000; t++) {
    const vs = [];
    while (vs.length < nv) {
      const c = POOL[rnd(POOL.length)];
      if (vs.every(v => v[0] * c[1] - v[1] * c[0] !== 0)) vs.push(c);   // 兩兩不平行
    }
    const st = [rnd(7) - 3 - 4, rnd(7) - 3];
    // 隨機走出一條路徑決定目標
    let cur = st.slice(), ok = true;
    const visited = new Set([key(...cur)]);
    for (let i = 0; i < want + 2; i++) {
      const v = vs[rnd(nv)], s = Math.random() < 0.75 ? 1 : -1;
      const nx = cur[0] + s * v[0], ny = cur[1] + s * v[1];
      if (!inB(nx, ny) || visited.has(key(nx, ny))) { ok = false; break; }
      cur = [nx, ny]; visited.add(key(nx, ny));
    }
    if (!ok) continue;
    const rk = new Set(), nRock = Math.min(4 + level * 2, 26);
    let guard = 0;
    while (rk.size < nRock && guard++ < 500) {
      // 一半的隕石刻意放在起終點附近，增加干擾
      const near = Math.random() < 0.5 ? st : cur;
      const x = Math.random() < 0.6 ? near[0] + rnd(9) - 4 : rnd(2 * XR + 1) - XR;
      const y = Math.random() < 0.6 ? near[1] + rnd(7) - 3 : rnd(2 * YR + 1) - YR;
      if (!inB(x, y) || (x === st[0] && y === st[1]) || (x === cur[0] && y === cur[1])) continue;
      rk.add(key(x, y));
    }
    const d = bfs(st, cur, vs, rk);
    if (d < want) continue;
    return { vs, st, tg: cur, rk, d };
  }
  return { vs: [[2,1],[-1,2]], st: [-4,0], tg: [0,5], rk: new Set(["-2,1"]), d: 3 };
}

function newLevel() {
  const g = gen();
  vecs = g.vs; start = g.st; target = g.tg; rocks = g.rk;
  fuel0 = g.d + (level <= 3 ? 1 : 0);
  resetPath();
  const box = $("moves"); box.innerHTML = "";
  vecs.forEach((v, i) => [1, -1].forEach(s => {
    const b = document.createElement("button");
    b.className = "btn";
    b.style.borderColor = cssVar(COLS[i]); b.style.minWidth = "108px";
    b.innerHTML = `${s > 0 ? "+" : "−"}${NAMES[i]} <small style="color:var(--text-dim)">(${s * v[0]}, ${s * v[1]})</small>`;
    b.onclick = () => move(i, s);
    box.appendChild(b);
  }));
  say(`第 ${level} 關：用最多 <b>${fuel0}</b> 步抵達 🪐。目標相對位置 = (${target[0] - start[0]}, ${target[1] - start[1]})`);
}
function resetPath() { path = [start.slice()]; fuel = fuel0; hud(); p.redraw(); }
function hud() {
  $("h-level").textContent = level; $("h-fuel").textContent = "⛽".repeat(Math.max(fuel, 0)) || "0";
  $("h-score").textContent = score; $("h-best").textContent = best;
}
function move(i, s) {
  const cur = path[path.length - 1];
  if (cur[0] === target[0] && cur[1] === target[1]) return;
  if (fuel <= 0) { say("燃料用完了！按「復原」或「重來」重新規劃路線", "bad"); return; }
  const nx = cur[0] + s * vecs[i][0], ny = cur[1] + s * vecs[i][1];
  if (!inB(nx, ny)) { say("那個方向會飛出星圖！", "bad"); return; }
  if (rocks.has(key(nx, ny))) { score = Math.max(0, score - 5); say("💥 撞上隕石！−5 分，已退回上一步的位置", "bad"); hud(); return; }
  path.push([nx, ny]); fuel--; hud(); p.redraw();
  if (nx === target[0] && ny === target[1]) {
    const pts = 20 + level * 10 + fuel * 10;
    score += pts; level++;
    if (level > best) { best = level; localStorage.setItem("vnav-best", best); }
    hud(); say(`🎉 抵達目標！+${pts} 分。前往第 ${level} 關…`, "ok");
    setTimeout(newLevel, 1500);
  } else if (fuel === 0) say("燃料耗盡但還沒到 🪐 …按「復原」或「重來」", "bad");
  else say(`還剩 ${fuel} 步，目前距離目標 (${target[0] - nx}, ${target[1] - ny})`);
}
$("b-undo").onclick = () => { if (path.length > 1) { path.pop(); fuel++; hud(); p.redraw(); say("已復原一步"); } };
$("b-reset").onclick = () => { resetPath(); say("回到起點重新規劃"); };
$("b-skip").onclick = () => { score = Math.max(0, score - 10); newLevel(); };

p.redraw = () => {
  p.clear();
  const c = p.ctx;
  // 整數格點（太空船只會停在這些點上）
  c.fillStyle = cssVar("--axis"); c.globalAlpha = 0.55;
  for (let gx = -XR; gx <= XR; gx++) for (let gy = -YR; gy <= YR; gy++) {
    c.beginPath(); c.arc(p.px(gx), p.py(gy), 1.6, 0, Math.PI * 2); c.fill();
  }
  c.globalAlpha = 1;
  // 邊界
  p.polygon([[-XR-0.5,-YR-0.5],[XR+0.5,-YR-0.5],[XR+0.5,YR+0.5],[-XR-0.5,YR+0.5]], null, 0, cssVar("--axis"), 1.5);
  const emoji = (x, y, ch, size = 20) => { c.font = size + "px sans-serif"; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText(ch, p.px(x), p.py(y)); };
  rocks.forEach(k => { const [x, y] = k.split(",").map(Number); emoji(x, y, "☄️", 18); });
  // 已走路徑
  for (let i = 1; i < path.length; i++) p.arrow(path[i-1][0], path[i-1][1], path[i][0], path[i][1], cssVar("--text"), 2.5);
  const cur = path[path.length - 1];
  // 可行步預告
  if (fuel > 0 && !(cur[0] === target[0] && cur[1] === target[1])) {
    c.globalAlpha = 0.4;
    vecs.forEach((v, i) => [1, -1].forEach(s => {
      const nx = cur[0] + s * v[0], ny = cur[1] + s * v[1];
      if (inB(nx, ny)) p.arrow(cur[0], cur[1], nx, ny, cssVar(COLS[i]), 2);
    }));
    c.globalAlpha = 1;
  }
  p.point(start[0], start[1], cssVar("--axis"), 4);
  emoji(target[0], target[1], "🪐", 26);
  emoji(cur[0], cur[1], "🚀", 24);
};
newLevel();
</script>
</body>
</html>
